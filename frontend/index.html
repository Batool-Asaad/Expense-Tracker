<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Expense Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">
            Expense Tracker
        </a>

        <button
            type="button"
            id="darkModeButton"
            class="btn btn-outline-light"
        >
            🌙 Dark Mode
        </button>
    </div>
</nav>

    <main class="container py-4">
      <!-- Page title -->
      <div class="mb-4">
        <h1>My Expenses</h1>
        <p class="text-muted">Track and manage your expenses</p>
      </div>

      <!-- Summary cards -->
      <div class="summary-grid mb-4">
        <div class="card summary-card h-100">
          <div class="card-body">
            <h6 class="card-title text-muted">Total Amount</h6>

            <p id="totalAmount" class="summary-value mb-0">$0.00</p>
          </div>
        </div>

        <div class="card summary-card h-100">
          <div class="card-body">
            <h6 class="card-title text-muted">Number of Expenses</h6>

            <p id="expenseCount" class="summary-value mb-0">0</p>
          </div>
        </div>

        <div class="card summary-card h-100">
          <div class="card-body">
            <h6 class="card-title text-muted">Highest Expense</h6>

            <p id="highestExpense" class="summary-value mb-0">$0.00</p>
          </div>
        </div>
      </div>

      <!-- Alert -->
      <div id="alertContainer"></div>

      <!-- Expense Chart -->
      <div class="card mb-5">
        <div class="card-body">
          <h2 class="card-title mb-4">Expenses by Category</h2>

          <div class="chart-container">
            <canvas id="categoryChart"></canvas>
          </div>
        </div>
      </div>
      <!-- Add expense form -->
      <div class="card mb-4">
        <div class="card-body">
          <h4 class="card-title mb-3">Add Expense</h4>

          <form id="expenseForm">
            <div class="row g-3">
              <!-- Title -->
              <div class="col-md-6">
                <label for="title" class="form-label"> Title </label>

                <input type="text" class="form-control" id="title" required />
              </div>

              <!-- Amount -->
              <div class="col-md-6">
                <label for="amount" class="form-label"> Amount </label>

                <input
                  type="number"
                  class="form-control"
                  id="amount"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>

              <!-- Category -->
              <div class="col-md-6">
                <label for="category" class="form-label"> Category </label>

                <select class="form-select" id="category" required>
                  <option value="">Choose category</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <!-- Date -->
              <div class="col-md-6">
                <label for="date" class="form-label"> Date </label>

                <input type="date" class="form-control" id="date" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary mt-3">
              Add Expense
            </button>
          </form>
        </div>
      </div>

      <!-- Expenses Header -->
<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="mb-0">Expenses</h4>

    <button
        type="button"
        id="exportCsvButton"
        class="btn btn-success"
    >
        Export CSV
    </button>
</div>


      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="searchInput" class="form-label"> Search by title </label>

          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Search expenses..."
          />
        </div>

        <div class="col-md-4">
          <label for="categoryFilter" class="form-label">
            Filter by category
          </label>

          <select id="categoryFilter" class="form-select">
            <option value="All">All</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="col-md-4">
          <label for="monthFilter" class="form-label"> Filter by month </label>

          <input type="month" id="monthFilter" class="form-control" />
        </div>
      </div>

      <!-- Loading spinner -->
      <div id="loadingSpinner" class="text-center my-4">
        <div class="spinner-border" role="status">
          <span class="visually-hidden"> Loading... </span>
        </div>
      </div>

      <!-- Expenses table -->
      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th>
                <button
                  type="button"
                  class="btn btn-link p-0 text-decoration-none"
                  onclick="sortExpenses('title')"
                >
                  Title ↕
                </button>
              </th>

              <th>
                <button
                  type="button"
                  class="btn btn-link p-0 text-decoration-none"
                  onclick="sortExpenses('amount')"
                >
                  Amount ↕
                </button>
              </th>

              <th>
                <button
                  type="button"
                  class="btn btn-link p-0 text-decoration-none"
                  onclick="sortExpenses('category')"
                >
                  Category ↕
                </button>
              </th>

              <th>
                <button
                  type="button"
                  class="btn btn-link p-0 text-decoration-none"
                  onclick="sortExpenses('date')"
                >
                  Date ↕
                </button>
              </th>

              <th>Actions</th>
            </tr>
          </thead>

          <tbody id="expensesTableBody">
            <!-- JavaScript will create the rows here -->
          </tbody>
        </table>
      </div>
    </main>

    <!-- Edit Expense Modal -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edit Expense</h5>

            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <form id="editForm">
              <input type="hidden" id="editId" />

              <div class="mb-3">
                <label for="editTitle" class="form-label"> Title </label>

                <input
                  type="text"
                  class="form-control"
                  id="editTitle"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editAmount" class="form-label"> Amount </label>

                <input
                  type="number"
                  class="form-control"
                  id="editAmount"
                  min="0.01"
                  step="0.01"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editCategory" class="form-label"> Category </label>

                <select class="form-select" id="editCategory" required>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Bills">Bills</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="editDate" class="form-label"> Date </label>

                <input
                  type="date"
                  class="form-control"
                  id="editDate"
                  required
                />
              </div>
            </form>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>

            <button type="submit" form="editForm" class="btn btn-primary">
              Save Changes
            </button>
          </div>
        </div>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script src="js/app.js"></script>
    
  </body>
</html>
